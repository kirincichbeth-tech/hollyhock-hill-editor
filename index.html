et doors=el('guest-journals');doors.scrollIntoView({behavior:'smooth',block:'start'})};loadPrivatePhotos()}else document.body.classList.remove('exact-owner');el('garden-switch').onclick=()=>{let on=el('app').classList.toggle('garden-view');el('garden-heading').textContent=on?'The Enchanted Garden':'Welcome to Hollyhock Hill';el('garden-subtitle').textContent=on?'Follow the moonlight through the hollyhocks. Every door holds a story.':'A private collection of memories, inspiration, and the little things that make a house a home.';el('garden-switch').textContent=on?'🏡 Return to the Main Entrance':'🌙 Enter the Enchanted Garden'};try{let rr=await api('/rest/v1/hh_rooms?select=*&order=sort_order.asc'),pp=await api('/rest/v1/hh_projects?select=*'),ph=await api('/rest/v1/hh_photos?select=*');let out=el('guest-journals');if(!rr.length){out.innerHTML='<p class="muted" style="text-align:center">No journals shared with this account yet. Ask the owner to invite this email address.</p>';return}let icons=['🥀','🌿','🖤','📷','🕯️','📖'];out.innerHTML='<div class="doorgrid">'+rr.map((r,i)=>'<button class="door" data-room="'+esc(r.id)+'"><span class="icon">'+icons[i%icons.length]+'</span><strong>'+esc(r.name)+'</strong><small>Enter journal →</small></button>').join('')+'</div><section id="guest-detail" class="guestgallery" hidden></section>';loadPrivatePhotos();for(let b of out.querySelectorAll('[data-room]'))b.onclick=()=>{let r=rr.find(x=>x.id===b.dataset.room);if(!r)return;let groups=new Map();for(let p of pp.filter(x=>x.room_id===r.id)){let k=p.title.trim().toLowerCase();if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p)}let detail=el('guest-detail');detail.hidden=false;detail.innerHTML='<button class="back" id="back-to-doors">← Back to journals</button><h2>'+esc(r.name)+'</h2>'+[...groups.values()].map(g=>{let p=g[0],ids=new Set(g.map(x=>x.id)),photos=ph.filter(x=>ids.has(x.project_id));return '<details class="item" '+(photos.length?'open':'')+'><summary>'+esc(p.title)+' <span let allPhotos=[];function renderJournal(){let rid=el('journal').value;let chosen=projects.filter(p=>String(p.room_id)===String(rid));let groups=new Map();for(let p of chosen){let key=p.title.trim().toLowerCase();if(!groups.has(key))groups.set(key,[]);groups.get(key).push(p)}el('room').value=rid;el('photo-project').innerHTML=[...groups.values()].map(g=>'<option value="'+g[0].id+'">'+esc(g[0].title)+'</option>').join('');el('gallery-title').textContent=(rooms.find(r=>String(r.id)===String(rid))?.name||'Journal')+' · Galleries';el('gallery-count').textContent=chosen.length+' categories · '+allPhotos.filter(x=>chosen.some(p=>String(p.id)===String(x.project_id))).length+' photos';el('list').innerHTML=[...groups.values()].map(g=>{let p=g[0],ids=new Set(g.map(x=>String(x.id))),pictures=allPhotos.filter(x=>ids.has(String(x.project_id)));return '<details class="item" '+(pictures.length?'open':'')+'><summary><strong>'+esc(p.title)+'</strong> <span class="count">('+pictures.length+' photos)</span></summary><div class="gallery">'+pictures.map(x=>'<figure><img loading="lazy" alt="'+esc(x.caption||p.title)+'" data-photo-path="'+esc(x.storage_path)+'" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="><figcaption>'+esc(x.caption||x.photo_type||'Photo')+'</figcaption></figure>').join('')+'</div></details>'}).join('')||'<p class="muted">No categories in this journal yet. Add a project above to begin.</p>';loadPrivatePhotos()}async function reload(){let previous=el('journal')?.value;rooms=await api('/rest/v1/hh_rooms?select=*&order=sort_order.asc');projects=await api('/rest/v1/hh_projects?select=*&order=created_at.desc');try{allPhotos=await api('/rest/v1/hh_photos?select=*&order=created_at.desc')}catch(e){status('Photo list: '+e.message)}el('room').innerHTML=rooms.map(r=>'<option value="'+r.id+'">'+esc(r.name)+'</option>').join('');el('journal').innerHTML=rooms.map(r=>'<option value="'+r.id+'">'+esc(r.name)+'</option>').join('');if(previous&&rooms.some(r=>String(r.id)===previous))el('journal').value=previous;else{let w=rooms.find(r=>r.name==='The Dark Wardrobe');if(w)el('journal').value=w.id}renderJournal();if(el('invite-room')){el('invite-room').innerHTML=rooms.map(r=>'<option value="'+r.id+'">'+esc(r.name)+'</option>').join('');await loadInvites()}if(el('wardrobe')&&rooms.some(r=>r.name==='The Dark Wardrobe'))el('wardrobe').style.display='none'}async function save(){try{if(!el('title').value.trim())throw Error('Please enter a title.');status('Saving…');await api('/rest/v1/hh_projects','POST',{room_id:el('room').value,title:el('title').value.trim(),description:el('notes').value,status:el('state').value});el('title').value='';el('notes').value='';await reload();status('Project saved!')}catch(e){status(e.message)}}async function addRoom(){try{let name=el('new-room').value.trim();if(!name)throw Error('Enter a room name.');await api('/rest/v1/hh_rooms','POST',{name,slug:name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now(),sort_order:rooms.length+1});el('new-room').value='';await reload();status('Room added!')}catch(e){status(e.message)}}async function upload(){try{let fs=[...el('photo').files],id=el('photo-project').value;if(!fs.length||!id)throw Error('Choose a project and photos.');for(let i=0;i<fs.length;i++){let f=fs[i];if(f.size>10485760)throw Error(f.name+' is over 10 MB.');status('Uploading '+(i+1)+' of '+fs.length+'…');let path=id+'/'+crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9.\-]/g,'_');await api('/storage/v1/object/hh-project-photos/'+path,'POST',f,f.type||'application/octet-stream');await api('/rest/v1/hh_photos','POST',{project_id:id,storage_path:path,caption:el('caption').value,photo_type:el('photo-type').value})}el('photo').value='';el('caption').value='';await reload();status('Saved '+fs.length+' photo(s)!')}catch(e){status('Upload failed: '+e.message)}}let stored=sessionStorage.getItem('hh_token');if(stored){token=stored;editor()}else login();
