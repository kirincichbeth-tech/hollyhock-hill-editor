const BASE='https://nedxngrhajjgebjhejjd.supabase.co',KEY='sb_publishable_fYqpyvsKuJTgAUeAguip4A_DxvYqJET';let token='',rooms=[],projects=[];const el=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,method='GET',body=null,ctype='application/json'){let headers={apikey:KEY,Authorization:'Bearer '+(token||KEY)};if(body)headers['Content-Type']=ctype;let res=await fetch(BASE+path,{method,headers,body:body?(ctype==='application/json'?JSON.stringify(body):body):undefined});let data=await res.text();try{data=JSON.parse(data)}catch{}if(!res.ok)throw Error(data.msg||data.message||data.error_description||data.error||'Request failed');return data}const field=(id,label,type='text')=>'<label>'+label+'<input id="'+id+'" type="'+type+'"></label>';const choose=(id,label,opts)=>'<label>'+label+'<select id="'+id+'">'+opts+'</select></label>';const status=x=>{let s=el('msg');if(s)s.textContent=x;let u=el('upload-msg');if(u)u.textContent=x};function login(){el('app').innerHTML='<h2>Sign in</h2><p class="muted">Create a login with your email and a password. Only approved editors can change journal entries.</p>'+field('email','Email','email')+field('password','Password (at least 8 characters)','password')+'<button id="signin">Sign in</button><button id="signup">Create login</button><p class="status" id="msg"></p>';el('signin').onclick=()=>auth('token');el('signup').onclick=()=>auth('signup')}async function auth(action){try{status('Please wait…');let email=el('email').value.trim(),password=el('password').value;if(!email||password.length<8)throw Error('Enter an email and password of at least 8 characters.');let d=await api('/auth/v1/'+(action==='token'?'token?grant_type=password':'signup'),'POST',{email,password});if(!d.access_token){status('Please check your email for a confirmation link, then return to sign in.');return}token=d.access_token;sessionStorage.setItem('hh_token' ry-title">Your photo galleries</h2><p class="muted" id="gallery-count"></p><div id="list"></div>';el('logout').onclick=logout;el('journal').onchange=renderJournal;el('invite').onclick=inviteGuest;el('save').onclick=save;el('upload').onclick=upload;el('add-room').onclick=addRoom;if(el('wardrobe'))el('wardrobe').onclick=setupWardrobe;await reload()}catch(e){el('app').innerHTML='<p class="status">'+esc(e.message)+'</p><button id="logout">Sign out</button>';el('logout').onclick=logout}}async function setupWardrobe(){try{status('Setting up The Dark Wardrobe…');let rr=await api('/rest/v1/hh_rooms?select=*');let room=rr.find(r=>r.name==='The Dark Wardrobe');if(!room){await api('/rest/v1/hh_rooms','POST',{name:'The Dark Wardrobe',slug:'dark-wardrobe-'+Date.now(),sort_order:rr.length+1});rr=await api('/rest/v1/hh_rooms?select=*');room=rr.find(r=>r.name==='The Dark Wardrobe')}if(!room)throw Error('Wardrobe room could not be found.');let pp=await api('/rest/v1/hh_projects?select=*');for(let title of ['Outfit Inspiration','Outfits I Have Worn','My Wardrobe','Pieces I Want','Accessories and Details','DIY and Restyling','Seasonal Looks','Signature Looks']){if(!pp.some(p=>p.room_id===room.id&&p.title===title))await api('/rest/v1/hh_projects','POST',{room_id:room.id,title,description:'The Dark Wardrobe',status:'in_progress'})}await reload();el('room').value=room.id;status('🖤 Your eight outfit categories are ready!')}catch(e){status('Setup failed: '+e.message)}}const photoCache=new Map();async function loadPrivatePhotos(){for(let img of document.querySelectorAll('img[data-photo-path]')){let path=img.getAttribute('data-photo-path');if(photoCache.has(path)){img.src=photoCache.get(path);continue}try{let r=await fetch(BASE+'/storage/v1/object/authenticated/hh-project-photos/'+path.split('/').map(encodeURIComponent).join('/'),{headers:{apikey:KEY,Authorization:'Bearer '+token}});if(!r.ok)throw Error('Access denied');let url=URL.createObjectURL(await r.blob());photoCache.set(path,url);if(img.isConnected)img.src=url}catch(e){img.alt='Photo unavailable: '+e.message}}}async function inviteGuest(){try{let email=el('invite-email').value.trim().toLowerCase(),room_id=el('invite-room').value;if(!email.includes('@')||!email.split('@')[1]?.includes('.')||email.includes(' '))throw Error('Enter a valid email.');await api('/rest/v1/hh_journal_invites','POST',{room_id,email});el('invite-email').value='';el('invite-msg').textContent='Access granted. Ask your guest to open this editor link and create a login with that email.';await loadInvites()}catch(e){el('invite-msg').textContent=e.message}}async function loadInvites(){try{let invites=await api('/rest/v1/hh_journal_invites?select=*&order=created_at.desc');el('invite-list').innerHTML=invites.map(i=>'<p class="muted">'+esc(i.email)+' · '+esc(rooms.find(r=>r.id===i.room_id)?.name||'Journal')+' <button data-revoke="'+i.id+'">Revoke</button></p>').join('')||'<p class="muted">No guests invited yet.</p>';for(let b of el('invite-list').querySelectorAll('[data-revoke]'))b.onclick=async()=>{if(!confirm('Revoke this guest’s journal access?'))return;try{await api('/rest/v1/hh_journal_invites?id=eq.'+b.dataset.revoke,'DELETE');await loadInvites()}catch(e){el('invite-msg').textContent=e.message}}}catch(e){el('invite-list').textContent='Invitations unavailable: '+e.message}}async function guestViewer(){document.querySelector('h1').textContent='Welcome to Hollyhock Hill';document.querySelector('main > .muted').textContent='A private collection of memories, inspiration, and the little things that make a house a home.';el('app').classList.add('guestpanel');el('app').innerHTML='<div style="text-align:right"><button id="logout">Sign out</button></div><div class="garden-title">✦ Hollyhock Hill ✦</div><div class="garden-est">Est. 1880</div><div class="garden-hero"><h2 id="garden-heading">Welcome to Hollyhock Hill</h2><p id="garden-subtitle">A private collection of memories, inspiration, and the little things that make a house a home.</p></div><div class="garden-nav"><button id="garden-switch" type="button">🌙 Enter the Enchanted Garden</button></div><p class="guesthead">✦ YOUR INVITATIONS ✦</p><h2 class="welcome">The Doors Are Open</h2><p class="muted intro">Choose a journal you have been invited to explore. Your visit is view-only.</p><div id="guest-journals"></div>';el('logout').onclick=logout;el('garden-switch').onclick=()=>{let on=el('app').classList.toggle('garden-view');el('garden-heading').textContent=on?'The Enchanted Garden':'Welcome to Hollyhock Hill';el('garden-subtitle').textContent=on?'Follow the moonlight through the hollyhocks. Every door holds a story.':'A private collection of memories, inspiration, and the little things that make a house a home.';el('garden-switch').textContent=on?'🏡 Return to the Main Entrance':'🌙 Enter the Enchanted Garden'};try{let rr=await api('/rest/v1/hh_rooms?select=*&order=sort_order.asc'),pp=await api('/rest/v1/hh_projects?select=*'),ph=await api('/rest/v1/hh_photos?select=*');let out=el('guest-journals');if(!rr.length){out.innerHTML='<p class="muted" style="text-align:center">No journals shared with this account yet. Ask the owner to invite this email address.</p>';return}let icons=['🥀','🌿','🖤','📷','🕯️','📖'];out.innerHTML='<div class="doorgrid">'+rr.map((r,i)=>'<button class="door" data-room="'+esc(r.id)+'"><span class="icon">'+icons[i%icons.length]+'</span><strong>'+esc(r.name)+'</strong><small>Enter journal →</small></button>').join('')+'</div><section id="guest-detail" class="guestgallery" hidden></section>';for(let b of out.querySelectorAll('[data-room]'))b.onclick=()=>{let r=rr.find(x=>x.id===b.dataset.room);if(!r)return;let groups=new Map();for(let p of pp.filter(x=>x.room_id===r.id)){let k=p.title.trim().toLowerCase();if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p)}let detail=el('guest-detail');detail.hidden=false;detail.innerHTML='<button class="back" id="back-to-doors">← Back to journals</button><h2>'+esc(r.name)+'</h2>'+[...groups.values()].map(g=>{let p=g[0],ids=new Set(g.map(x=>x.id)),photos=ph.filter(x=>ids.has(x.project_id));return '<details class="item" '+(photos.length?'open':'')+'><summary>'+esc(p.title)+' <span class="count">('+photos.length+' photos)</span></summary><div class="gallery">'+photos.map(x=>'<figure><img loading="lazy" data-photo-path="'+esc(x.storage_path)+'" alt="'+esc(x.caption||p.title)+'"><figcaption>'+esc(x.caption||'')+'</figcaption></figure>').join('')+'</div></details>'}).join('');out.querySelector('.doorgrid').hidden=true;el('back-to-doors').onclick=()=>{detail.hidden=true;out.querySelector('.doorgrid').hidden=false;window.scrollTo({top:0,behavior:'smooth'})};loadPrivatePhotos();detail.scrollIntoView({behavior:'smooth',block:'start'})}}catch(e){el('guest-journals').textContent='Unable to load journals: '+e.message}}
let allPhotos=[];function renderJournal(){let rid=el('journal').value;let chosen=projects.filter(p=>String(p.room_id)===String(rid));let groups=new Map();for(let p of chosen){let key=p.title.trim().toLowerCase();if(!groups.has(key))groups.set(key,[]);groups.get(key).push(p)}el('room').value=rid;el('photo-project').innerHTML=[...groups.values()].map(g=>'<option value="'+g[0].id+'">'+esc(g[0].title)+'</option>').join('');el('gallery-title').textContent=(rooms.find(r=>String(r.id)===String(rid))?.name||'Journal')+' · Galleries';el('gallery-count').textContent=chosen.length+' categories · '+allPhotos.filter(x=>chosen.some(p=>String(p.id)===String(x.project_id))).length+' photos';el('list').innerHTML=[...groups.values()].map(g=>{let p=g[0],ids=new Set(g.map(x=>String(x.id))),pictures=allPhotos.filter(x=>ids.has(String(x.project_id)));return '<details class="item" '+(pictures.length?'open':'')+'><summary><strong>'+esc(p.title)+'</strong> <span class="count">('+pictures.length+' photos)</span></summary><div class="gallery">'+pictures.map(x=>'<figure><img loading="lazy" alt="'+esc(x.caption||p.title)+'" data-photo-path="'+esc(x.storage_path)+'" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="><figcaption>'+esc(x.caption||x.photo_type||'Photo')+'</figcaption></figure>').join('')+'</div></details>'}).join('')||'<p class="muted">No categories in this journal yet. Add a project above to begin.</p>';loadPrivatePhotos()}async function reload(){let previous=el('journal')?.value;rooms=await api('/rest/v1/hh_rooms?select=*&order=sort_order.asc');projects=await api('/rest/v1/hh_projects?select=*&order=created_at.desc');try{allPhotos=await api('/rest/v1/hh_photos?select=*&order=created_at.desc')}catch(e){status('Photo list: '+e.message)}el('room').innerHTML=rooms.map(r=>'<option value="'+r.id+'">'+esc(r.name)+'</option>').join('');el('journal').innerHTML=rooms.map(r=>'<option value="'+r.id+'">'+esc(r.name)+'</option>').join('');if(previous&&rooms.some(r=>String(r.id)===previous))el('journal').value=previous;else{let w=rooms.find(r=>r.name==='The Dark Wardrobe');if(w)el('journal').value=w.id}renderJournal();if(el('invite-room')){el('invite-room').innerHTML=rooms.map(r=>'<option value="'+r.id+'">'+esc(r.name)+'</option>').join('');await loadInvites()}if(el('wardrobe')&&rooms.some(r=>r.name==='The Dark Wardrobe'))el('wardrobe').style.display='none'}async function save(){try{if(!el('title').value.trim())throw Error('Please enter a title.');status('Saving…');await api('/rest/v1/hh_projects','POST',{room_id:el('room').value,title:el('title').value.trim(),description:el('notes').value,status:el('state').value});el('title').value='';el('notes').value='';await reload();status('Project saved!')}catch(e){status(e.message)}}async function addRoom(){try{let name=el('new-room').value.trim();if(!name)throw Error('Enter a room name.');await api('/rest/v1/hh_rooms','POST',{name,slug:name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now(),sort_order:rooms.length+1});el('new-room').value='';await reload();status('Room added!')}catch(e){status(e.message)}}async function upload(){try{let fs=[...el('photo').files],id=el('photo-project').value;if(!fs.length||!id)throw Error('Choose a project and photos.');for(let i=0;i<fs.length;i++){let f=fs[i];if(f.size>10485760)throw Error(f.name+' is over 10 MB.');status('Uploading '+(i+1)+' of '+fs.length+'…');let path=id+'/'+crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9.\-]/g,'_');await api('/storage/v1/object/hh-project-photos/'+path,'POST',f,f.type||'application/octet-stream');await api('/rest/v1/hh_photos','POST',{project_id:id,storage_path:path,caption:el('caption').value,photo_type:el('photo-type').value})}el('photo').value='';el('caption').value='';await reload();status('Saved '+fs.length+' photo(s)!')}catch(e){status('Upload failed: '+e.message)}}let stored=sessionStorage.getItem('hh_token');if(stored){token=stored;editor()}else login();
