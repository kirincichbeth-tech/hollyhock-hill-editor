<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hollyhock Hill | Journal Editor</title><style>body{margin:0;background:#09182b;color:#f4f0e8;font:16px Arial,sans-serif;padding:25px}main{max-width:740px;margin:auto}h1,h2{font-family:Georgia,serif;font-weight:normal}h1{font-size:44px;text-align:center}.brand{text-align:center;color:#e3c18b;letter-spacing:3px}.panel{background:#102841;border:1px solid #4d6982;border-radius:18px;padding:24px;margin:22px 0}label{display:block;margin:14px 0}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;font-size:16px;border-radius:8px;border:1px solid #8195aa}button{background:#dfbd85;color:#152942;padding:12px 17px;border:0;border-radius:9px;font-weight:bold;margin:5px 7px 5px 0;cursor:pointer}.muted{color:#bdcddd;line-height:1.6}.item{border:1px solid #536d86;border-radius:10px;padding:14px;margin:10px 0}.status{color:#e8cb95}hr{border:0;border-top:1px solid #536d86;margin:25px 0}a{color:#e8cb95}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:12px;margin-top:15px}.gallery figure{margin:0}.gallery img{width:100%;height:140px;object-fit:cover;border-radius:8px}.gallery figcaption{font-size:12px;color:#dfc2d1;margin-top:5px}</style><main><p class="brand">✦ HOLLYHOCK HILL ✦</p><h1>The Journal Editor</h1><p class="muted">Your private place to record projects and upload photographs from your phone or computer.</p><div class="panel" id="app">Loading…</div><p><a href="https://hollyhock-hill-home-projects.webflow.io">← View public journal</a></p></main><script>
const BASE='https://nedxngrhajjgebjhejjd.supabase.co',KEY='sb_publishable_fYqpyvsKuJTgAUeAguip4A_DxvYqJET';let token='',rooms=[],projects=[];const el=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,method='GET',body=null,ctype='application/json'){let headers={apikey:KEY,Authorization:'Bearer '+(token||KEY)};if(body)headers['Content-Type']=ctype;let res=await fetch(BASE+path,{method,headers,body:body?(ctype==='application/json'?JSON.stringify(body):body):undefined});let data=await res.text();try{data=JSON.parse(data)}catch{}if(!res.ok)throw Error(data.msg||data.message||data.error_description||data.error||'Request failed');return data}const field=(id,label,type='text')=>'<label>'+label+'<input id="'+id+'" type="'+type+'"></label>';const choose=(id,label,opts)=>'<label>'+label+'<select id="'+id+'">'+opts+'</select></label>';const status=x=>{let s=el('msg');if(s)s.textContent=x;let u=el('upload-msg');if(u)u.textContent=x};function login(){el('app').innerHTML='<h2>Sign in</h2><p class="muted">Create a login with your email and a password. Only approved editors can change journal entries.</p>'+field('email','Email','email')+field('password','Password (at least 8 characters)','password')+'<button id="signin">Sign in</button><button id="signup">Create login</button><p class="status" id="msg"></p>';el('signin').onclick=()=>auth('token');el('signup').onclick=()=>auth('signup')}async function auth(action){try{status('Please wait…');let email=el('email').value.trim(),password=el('password').value;if(!email||password.length<8)throw Error('Enter an email and password of at least 8 characters.');let d=await api('/auth/v1/'+(action==='token'?'token?grant_type=password':'signup'),'POST',{email,password});if(!d.access_token){status('Please check your email for a confirmation link, then return to sign in.');return}token=d.access_token;sessionStorage.setItem('hh_token',token);await editor()}catch(e){status(e.message)}}function logout(){sessionStorage.removeItem('hh_token');token='';login()}async function editor(){try{let owner=await api('/rest/v1/hh_editors?select=user_id&limit=1');if(!owner.length){el('app').innerHTML='<h2>Account created</h2><p class="muted">You are signed in, but editor permissions still need to be activated. Tell ChatGPT “I signed in to the journal editor” to complete that step.</p><button id="logout">Sign out</button>';el('logout').onclick=logout;return}el('app').innerHTML='<button id="logout">Sign out</button><p class="status" id="msg"></p><h2>Add a project</h2>'+choose('room','Room','')+field('title','Project title')+'<label>Notes<textarea id="notes" rows="4"></textarea></label>'+choose('state','Status','<option value="planned">Planned</option><option value="in_progress">In progress</option><option value="completed">Completed</option>')+'<button id="save">Save project</button><hr><h2>Upload a photo</h2>'+choose('photo-project','Project','')+'<label>Choose photos<input id="photo" type="file" accept="image/*" multiple></label>'+field('caption','Caption')+choose('photo-type','Photo type','<option value="progress">Progress</option><option value="before">Before</option><option value="after">After</option><option value="inspiration">Inspiration</option>')+'<button id="upload">Upload selected photos</button><p class="status" id="upload-msg"></p><hr><h2>Add a room</h2>'+field('new-room','Room name')+'<button id="add-room">Add room</button><hr><h2>🖤 The Dark Wardrobe</h2><p class="muted">Create your eight outfit categories, then upload photos to each category above.</p><button id="wardrobe">Set up my outfit journal</button><hr><h2>Projects</h2><div id="list"></div>';el('logout').onclick=logout;el('save').onclick=save;el('upload').onclick=upload;el('add-room').onclick=addRoom;if(el('wardrobe'))el('wardrobe').onclick=setupWardrobe;await reload()}catch(e){el('app').innerHTML='<p class="status">'+esc(e.message)+'</p><button id="logout">Sign out</button>';el('logout').onclick=logout}}async function setupWardrobe(){try{status('Setting up The Dark Wardrobe…');let rr=await api('/rest/v1/hh_rooms?select=*');let room=rr.find(r=>r.name==='The Dark Wardrobe');if(!room){await api('/rest/v1/hh_rooms','POST',{name:'The Dark Wardrobe',slug:'dark-wardrobe-'+Date.now(),sort_order:rr.length+1});rr=await api('/rest/v1/hh_rooms?select=*');room=rr.find(r=>r.name==='The Dark Wardrobe')}if(!room)throw Error('Wardrobe room could not be found.');let pp=await api('/rest/v1/hh_projects?select=*');for(let title of ['Outfit Inspiration','Outfits I Have Worn','My Wardrobe','Pieces I Want','Accessories and Details','DIY and Restyling','Seasonal Looks','Signature Looks']){if(!pp.some(p=>p.room_id===room.id&&p.title===title))await api('/rest/v1/hh_projects','POST',{room_id:room.id,title,description:'The Dark Wardrobe',status:'in_progress'})}await reload();el('room').value=room.id;status('🖤 Your eight outfit categories are ready!')}catch(e){status('Setup failed: '+e.message)}}async function reload(){rooms=await api('/rest/v1/hh_rooms?select=*&order=sort_order.asc');projects=await api('/rest/v1/hh_projects?select=*&order=created_at.desc');let photos=[];try{photos=await api('/rest/v1/hh_photos?select=*&order=created_at.desc')}catch(e){status('Photo list: '+e.message)}el('room').innerHTML=rooms.map(r=>'<option value="'+r.id+'">'+esc(r.name)+'</option>').join('');el('photo-project').innerHTML=projects.map(p=>'<option value="'+p.id+'">'+esc(p.title)+'</option>').join('');el('list').innerHTML=projects.map(p=>'<div class="item"><strong>'+esc(p.title)+'</strong><p class="muted">'+esc(p.description)+'</p><small>'+esc(p.status)+'</small><div class="gallery">'+photos.filter(x=>x.project_id===p.id).map(x=>'<figure><img loading="lazy" alt="'+esc(x.caption||p.title)+'" src="'+BASE+'/storage/v1/object/public/hh-project-photos/'+x.storage_path.split('/').map(encodeURIComponent).join('/')+'"><figcaption>'+esc(x.caption||x.photo_type||'Photo')+'</figcaption></figure>').join('')+'</div></div>').join('')||'<p class="muted">No projects yet.</p>'}async function save(){try{if(!el('title').value.trim())throw Error('Please enter a title.');status('Saving…');await api('/rest/v1/hh_projects','POST',{room_id:el('room').value,title:el('title').value.trim(),description:el('notes').value,status:el('state').value});el('title').value='';el('notes').value='';await reload();status('Project saved!')}catch(e){status(e.message)}}async function addRoom(){try{let name=el('new-room').value.trim();if(!name)throw Error('Enter a room name.');await api('/rest/v1/hh_rooms','POST',{name,slug:name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now(),sort_order:rooms.length+1});el('new-room').value='';await reload();status('Room added!')}catch(e){status(e.message)}}async function upload(){try{let fs=[...el('photo').files],id=el('photo-project').value;if(!fs.length||!id)throw Error('Choose a project and photos.');for(let i=0;i<fs.length;i++){let f=fs[i];if(f.size>10485760)throw Error(f.name+' is over 10 MB.');status('Uploading '+(i+1)+' of '+fs.length+'…');let path=id+'/'+crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9.\-]/g,'_');await api('/storage/v1/object/hh-project-photos/'+path,'POST',f,f.type||'application/octet-stream');await api('/rest/v1/hh_photos','POST',{project_id:id,storage_path:path,caption:el('caption').value,photo_type:el('photo-type').value})}el('photo').value='';el('caption').value='';await reload();status('Saved '+fs.length+' photo(s)!')}catch(e){status('Upload failed: '+e.message)}}let stored=sessionStorage.getItem('hh_token');if(stored){token=stored;editor()}else login();
</script></html>
